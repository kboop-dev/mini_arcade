name: mini_arcade
description: "App arcade con minijuegos, XP y rangos, hecha con Flutter + Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4
  firebase_storage: 12.3.4

  # Estado
  provider: 6.1.2

  # UI / Juegos
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  confetti: ^0.7.0
  audioplayers: ^6.1.0

  # Utilidades
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:          
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/icon/icono1.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Declaración de archivos de soporte (imágenes, fuentes y audio)
  assets:
    - assets/images/icon/
    - assets/images/characters/
    - assets/images/puzzles/
    - assets/images/tickets/
    - assets/images/backgrounds/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: PixelFont
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf